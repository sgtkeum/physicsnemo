# Recipe 2: out-of-distribution detection of SimJEB designs for the DeepJEB-trained model (ood.py).
checkpoint: outputs/deepjeb/model.mdlus
reference:                         # in distribution: what the model was trained on
  root: ???                        # converted DeepJEB
  split: splits/deepjeb.json       # fit on train, threshold on val, false alarms on test
  designs: 600                     # random training designs to fit the detectors (null: all)
query:                             # designs to screen
  root: ???                        # converted SimJEB
  split: splits/simjeb.json
  subsets: [train, val, test]
  errors: null                     # optional <evaluate.py output>_cases.csv of these designs, to rank the scores
scales: stats/deepjeb_scales.json
coordinate_scale_mm: 100.0
token_voxel_mm: 2.0
load: ver                          # load case of the forward pass that yields the latents
block: 3                           # 0-based index of the GALE block whose node-mean output is scored (the 4th of 8; reported as block4)
percentile: 99.0                   # threshold of the latent scores: this percentile of the validation designs
knn_k: 10                          # embedded guard
seed: 0
max_designs: null                  # cap every group (smoke tests)
output_dir: outputs/ood

hydra:
  run:
    dir: outputs/hydra
  output_subdir: null
  job:
    chdir: false
